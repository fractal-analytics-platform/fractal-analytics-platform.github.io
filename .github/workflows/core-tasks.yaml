name: Core tasks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:

  validate:
    name: Validate core-tasks list
    runs-on: ubuntu-24.04

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.25"
          python-version: "3.12"

      - run: uv run --frozen core_tasks/validate_list.py
